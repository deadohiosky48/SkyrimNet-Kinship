plugin:
  name: "SkyrimNet Kinship"
  version: "1.2.0"
  description: "Makes parentage from Fertility Mode Reloaded permanent and visible to SkyrimNet — a child knows who its parents are, and a mother never forgets the child she bore."
  icon: "🍼"

# NOTE: SkyrimNet plugin manifests DO NOT support dotted paths. Each dotted
# path collapses to its final segment and later ones overwrite earlier ones -
# verified against SeverActions (six llm.* fields became a single "timeout")
# and the Romantasy mod (five log.* fields became one). Keys must be flat and
# unique, and every one below is.
#
# EVERY PATH STARTS WITH "kin", AND NO PAPYRUS FUNCTION IN THIS MOD DOES.
# Papyrus interns strings case-insensitively, so a function named PollHours and
# the literal "pollHours" would collide in the string table: the identifier
# wins, the literal is stored folded to it, and the config lookup silently
# returns its default forever. The prefix makes that collision structurally
# impossible instead of something a future edit has to remember. Verified after
# every build by tools/check.ps1, which greps the compiled .pex for each of
# these literals in exact case.
#
# DO NOT EDIT THIS FILE WITH PowerShell 5.1's Get-Content/Set-Content. Its
# Get-Content reads as ANSI when a file has no BOM, so the em-dash above and
# the emoji become mojibake on the round trip - which happened once already and
# both of those render in the SkyrimNet dashboard. Use an editor, or
# [System.IO.File]::ReadAllBytes/WriteAllBytes.
schema:
  fields:
    - name: "Enabled"
      path: "kinEnabled"
      type: "bool"
      description: "Record and render parentage for Fertility Mode Reloaded children. Turning this off stops new births being noticed but does not erase anything already recorded."
      defaultValue: true
      category: "General"

    - name: "Check Interval (game hours)"
      path: "kinPollHours"
      type: "string"
      description: "Game hours between checks for a new birth. Fertility Mode Reloaded runs its own simulation on a game-time timer of its own, so checking faster than it updates cannot find anything sooner and only spends script budget. Default 1.0, which matches Fertility Mode's own polling interval. Lowering it does NOT meaningfully reduce ties: mothers who conceive together mature seconds apart in game time, far inside any interval you could set, which is why an unresolvable pair is handled by recording a candidate list rather than by polling harder."
      defaultValue: "1.0"
      category: "General"

    - name: "Seed Children Who Already Exist"
      path: "kinSeedExisting"
      type: "bool"
      description: "On first run, record the player as father for every child already in Fertility Mode's list. Their mothers cannot be recovered - Fertility Mode never stored that - so those stay blank until you set them by hand. Turn this off to track only children born from now on."
      defaultValue: true
      category: "General"

    - name: "Life Stages"
      path: "kinStagesEnabled"
      type: "bool"
      description: "Let children age through newborn, infant, toddler, child and adolescent before adulthood, instead of jumping straight from birth to grown. Off by default. Turning it on plants every child already on the roster at the stage set below, because their recorded birth date is when this mod first saw them rather than when they were born - computing from it would call a grown child a newborn. They age on normally from wherever they are planted, and individuals can be corrected in the panel."
      defaultValue: false
      category: "Life Stages"

    - name: "Newborn Duration (game days)"
      path: "kinStageNewbornDays"
      type: "string"
      description: "How long a child stays a newborn. Keep this under Fertility Mode's own Baby Duration if you are using its carried baby item, or it will mature the child out from under you."
      defaultValue: "3.0"
      category: "Life Stages"

    - name: "Infant Duration (game days)"
      path: "kinStageInfantDays"
      type: "string"
      description: "How long a child stays an infant."
      defaultValue: "14.0"
      category: "Life Stages"

    - name: "Toddler Duration (game days)"
      path: "kinStageToddlerDays"
      type: "string"
      description: "How long a child stays a toddler. Values bend most easily around here - see the mod's notes on plasticity."
      defaultValue: "30.0"
      category: "Life Stages"

    - name: "Child Duration (game days)"
      path: "kinStageChildDays"
      type: "string"
      description: "How long a child stays a child. The longest stage by default, and the one most of a childhood is actually spent in."
      defaultValue: "90.0"
      category: "Life Stages"

    - name: "Adolescent Duration (game days)"
      path: "kinStageAdolescentDays"
      type: "string"
      description: "How long a child stays an adolescent before reaching adulthood."
      defaultValue: "60.0"
      category: "Life Stages"

    - name: "Stage For Existing Children"
      path: "kinStageBackfill"
      type: "string"
      description: "The stage to plant children who already existed when life stages were switched on. Their recorded birth date is when this mod first saw them, not when they were born, so computing a stage from it would call a grown child a newborn. 0 newborn, 1 infant, 2 toddler, 3 child, 4 adolescent, 5 adult. Correct individuals in the panel afterwards."
      defaultValue: "3"
      category: "Life Stages"

    - name: "Assign Parent Hotkey"
      path: "kinHotkey"
      type: "string"
      description: "DirectX scan code for the in-game menu that assigns a parent to a child. Point at someone and press it, or use it to pick from everyone Fertility Mode is tracking. Default 10, used with the modifier below as Left Shift + 9. NOTE the digit row is offset by one in DirectX scan codes: 2 is '1', 10 is '9', 11 is '0' - scan code 9 is the '8' key. Other commonly free codes: 87 F11, 88 F12, 199 Home, 207 End, 210 Insert, 197 Pause. Deliberately not 70 (Scroll Lock): NPC Renamer claims it and many keyboards lack the key. Set to 0 to disable the key entirely."
      defaultValue: "10"
      category: "Assigning Parents"

    - name: "Hotkey Modifier"
      path: "kinHotkeyModifier"
      type: "string"
      description: "Optional key that must be held with the hotkey, for a Dynamic-Activation-Key style chord. 0 for none, 42 Left Shift, 29 Left Ctrl, 56 Left Alt. Default 42 (Left Shift), giving Left Shift + 9. A chord is the default because it cannot collide with a bare keypress in a large load order - though note the modifier is only checked by this mod, so whatever else owns the base key still sees the press."
      defaultValue: "42"
      category: "Assigning Parents"

    - name: "Log Level"
      path: "kinLogLevel"
      type: "string"
      description: "Diagnostic verbosity in logs/snkin.log. 0 off, 1 error, 2 warn, 3 info, 4 debug. Level 2 is worth keeping on: an unresolvable mother is logged as a warning, and that is the one thing you would want to fix by hand. Default: 3."
      defaultValue: "3"
      category: "Logging"

    - name: "In-Game Notifications"
      path: "kinNotify"
      type: "bool"
      description: "Show a corner notification when a birth is recorded, including when it is recorded without a mother. For troubleshooting only."
      defaultValue: false
      category: "Logging"
